services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
    environment:
      - PGPASSWORD=postgres
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -h db -U postgres -f /migrations/000_local_init.sql &&
        psql -v ON_ERROR_STOP=1 -h db -U postgres -f /migrations/008_redemption_history.sql &&
        psql -v ON_ERROR_STOP=1 -h db -U postgres -f /migrations/010_auto_redeem_server.sql &&
        psql -v ON_ERROR_STOP=1 -h db -U postgres -f /migrations/011_redemption_history_amount.sql &&
        psql -v ON_ERROR_STOP=1 -h db -U postgres -f /migrations/013_member_can_withdraw.sql &&
        echo "Migrations complete"

  # Local stand-in for pg_cron: fires the server-side auto-redeem every 30s (it only acts once a day at the admin time)
  scheduler:
    image: postgres:16-alpine
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      - PGPASSWORD=postgres
    entrypoint: ["sh", "-c"]
    command:
      - while true; do psql -h db -U postgres -qAt -c "select public.run_auto_redeem()" >/dev/null 2>&1; sleep 30; done
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "psql -h db -U postgres -qAt -c \"select to_regprocedure('public.run_auto_redeem()') is not null\" | grep -qx t"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api:
    image: postgrest/postgrest:v12.2.3
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - PGRST_DB_URI=postgres://postgres:postgres@db:5432/postgres
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
      - PGRST_DB_SCHEMA=public
      - PGRST_SERVER_PORT=3000
    # This distroless image has no HTTP probe executable; proxy checks REST responsiveness.

  storage:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./scripts/local-storage.cjs:/app/local-storage.cjs:ro
      - storage_data:/data
    command: ["node", "--watch", "local-storage.cjs"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/', {signal: AbortSignal.timeout(3000)}).then(async r => {if (r.status !== 404 || (await r.json()).message !== 'Unsupported') process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  proxy:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      api:
        condition: service_started
      storage:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null 'http://127.0.0.1:8000/rest/v1/members?select=id,can_withdraw&limit=0' || { echo 'REST API is not responding'; exit 1; }"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/', {signal: AbortSignal.timeout(3000)}).then(async r => {if (!r.ok || !(await r.text()).includes('/@vite/client')) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  db_data:
  storage_data:
